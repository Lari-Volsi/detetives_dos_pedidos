<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detetives dos Pedidos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
/* Layout: caderno de investigação — painel do caso (cena + pistas) ao lado do painel de perguntas, uma pergunta por vez.
   Tema claro único, por escolha: identidade StartLab (branco, azul-marinho, roxo, verde, amarelo). */
:root{
  --paper:#F4F5FB;
  --card:#FFFFFF;
  --ink:#1C2551;
  --ink-soft:#4A5280;
  --line:#D8DBEB;
  --purple:#5B3FD0;
  --purple-deep:#4630AA;
  --purple-tint:#ECE8FD;
  --green:#157A52;
  --green-tint:#E3F5EC;
  --yellow:#FFC83D;
  --yellow-deep:#C99400;
  --yellow-tint:#FFF4D1;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:500 18px/1.5 var(--font);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;
}
.wrap{max-width:1120px;margin:0 auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 7px var(--yellow)}
h1,h2,h3{text-wrap:balance}
button{font:inherit}

/* Barra superior */
.topbar{display:flex;align-items:center;gap:16px;padding-block:16px;margin-bottom:20px}
.brand-icon{width:34px;height:34px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.brand svg{width:34px;height:34px;flex:none}
.progress{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.progress[hidden]{display:none!important}
.mdots{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.mdot{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--ink-soft)}
.mdot.current{border-color:var(--purple);color:var(--purple);box-shadow:0 0 0 4px var(--purple-tint)}
.mdot.done{background:var(--green);border-color:var(--green);color:#FFFFFF}
.ptext{font-size:.95rem;font-weight:700;color:var(--ink-soft)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 30px;border:none;border-radius:999px;background:var(--purple);color:#FFFFFF;font-weight:800;font-size:1.12rem;cursor:pointer;touch-action:manipulation}
.btn:hover{background:var(--purple-deep)}
.btn svg{width:24px;height:24px;flex:none}

/* Tela inicial */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:56px 24px}
.intro-text{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.btn-big{min-height:66px;padding:14px 40px;font-size:1.35rem}
.intro h1{font-size:clamp(2.6rem,6vw,4rem);line-height:1.05;margin:0;font-weight:900;letter-spacing:-.01em}
.intro h1 span{color:var(--purple)}
.eyebrow{font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.lead{font-size:1.4rem;font-weight:700;max-width:26ch;margin:0}
.qs{list-style:none;padding:0;margin:0 0 26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px}
.qs li{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:1rem}
.qs .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900}
.intro-art{width:100%;max-width:420px;height:auto;margin:0 auto;display:block}
.foot{margin-top:28px;font-size:.82rem;color:var(--ink-soft)}

/* Missão */
.mission{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
.case,.quest{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px}
.case{display:flex;flex-direction:column;gap:16px}
.case-head{display:flex;align-items:center;gap:14px}
.case-head svg{width:64px;height:64px;flex:none}
.case-title{margin:2px 0 0;font-size:1.5rem;line-height:1.2;font-weight:800}
.scene{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.scene text{font-family:var(--font)}
.situation{display:flex;flex-direction:column;gap:10px}
.situation p{margin:0;font-size:1.2rem;font-weight:600}
.situation .quote{background:var(--yellow-tint);border:2px dashed var(--yellow-deep);border-radius:14px;padding:10px 14px;font-weight:800}
.clues-title{margin:0;font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.clue{border:2px dashed var(--line);border-radius:14px;padding:8px 12px;min-height:66px;display:flex;flex-direction:column;gap:2px}
.clue .lbl{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.clue .val{font-size:.95rem;font-weight:700;color:var(--ink-soft);line-height:1.3}
.clue.found{border-style:solid;border-color:var(--green);background:var(--green-tint)}
.clue.found .val{color:var(--ink)}

.quest{display:flex;flex-direction:column}
.q-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:var(--purple-tint);color:var(--purple);font-weight:800;font-size:.9rem;border-radius:999px;padding:5px 14px}
.pips{display:flex;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--purple)}
.pip.ok{background:var(--green)}
.q-title{margin:14px 0 20px;font-size:1.75rem;line-height:1.2;font-weight:800}
.q-help{margin:0 0 18px;color:var(--ink-soft);font-size:1rem}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{width:100%;min-height:66px;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);color:var(--ink);border:2.5px solid var(--line);border-radius:18px;padding:12px 16px;font-size:1.2rem;font-weight:700;line-height:1.35;cursor:pointer;touch-action:manipulation}
.opt:hover:not(:disabled):not([aria-disabled="true"]){border-color:var(--purple);background:var(--purple-tint)}
.opt-key{flex:none;width:38px;height:38px;border-radius:50%;background:var(--purple-tint);color:var(--purple);display:grid;place-items:center;font-weight:900}
.opt-text{flex:1;min-width:0}
.opt-tag{flex:none;display:none;font-size:.8rem;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.opt.tried{border-style:dashed;background:var(--paper);color:var(--ink-soft);cursor:default}
.opt.tried .opt-key{background:var(--line);color:var(--ink-soft)}
.opt.tried .opt-tag{display:inline-block;background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft)}
.opt.correct{border-color:var(--green);background:var(--green-tint)}
.opt.correct .opt-key{background:var(--green);color:#FFFFFF}
.opt.correct .opt-tag{display:inline-block;background:var(--green);color:#FFFFFF}
.opt:disabled:not(.correct){opacity:.5;cursor:default}

.feedback{display:flex;gap:12px;align-items:flex-start;margin-top:18px;border-radius:18px;padding:14px 16px}
.feedback:empty{display:block;margin:0;padding:0}
.feedback.ok{background:var(--green-tint);border:2px solid var(--green)}
.feedback.hint{background:var(--yellow-tint);border:2px solid var(--yellow-deep)}
.fb-icon{flex:none;width:40px;height:40px}
.fb-title{display:block;font-weight:900;font-size:1.08rem}
.fb-body{margin:0;font-size:1.15rem;font-weight:700;align-self:center}
.actions{display:flex;justify-content:flex-end;margin-top:18px}

/* Conclusão da missão */
.stamp{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:3px solid var(--green);color:var(--green);border-radius:12px;padding:6px 14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-3deg)}
.stamp svg{width:22px;height:22px}
.chain{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.chain li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.chain li:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:3px;background:var(--line);border-radius:2px}
.chain .dot{flex:none;width:37px;height:37px;border-radius:50%;background:var(--purple-tint);color:var(--purple);display:grid;place-items:center;font-weight:900}
.chain li.key .dot{background:var(--green);color:#FFFFFF}
.chain .lbl{display:block;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.chain .val{font-weight:700}
.lesson{margin-top:20px;background:var(--yellow-tint);border:2px solid var(--yellow-deep);border-radius:18px;padding:14px 16px}
.lesson .lbl{display:block;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.lesson p{margin:0;font-size:1.45rem;line-height:1.3;font-weight:800}

/* Tela final */
.final{max-width:760px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px}
.badge{width:200px;height:auto}
.final h1{margin:0;font-size:clamp(2.2rem,6vw,3.2rem);font-weight:900;color:var(--purple);letter-spacing:.02em}
.final .lead{max-width:40ch;margin:0}
.three{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.three li{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:1.08rem}
.three .n{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900}
.guide{width:100%;background:var(--ink);color:#FFFFFF;border-radius:20px;padding:16px 20px;font-size:1.25rem;font-weight:900;display:flex;align-items:center;justify-content:center;gap:12px}
.guide svg{width:34px;height:34px;flex:none}
.remember{width:100%;display:flex;flex-direction:column;gap:6px}
.remember h2{margin:0;font-size:1.2rem;font-weight:800}
.recap{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px}
.recap h2{margin:0 0 8px;font-size:1.05rem;font-weight:800}
.recap ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.recap li{display:flex;gap:10px;align-items:baseline;font-size:1rem}
.recap b{flex:none;min-width:12ch}

@media (max-width:880px){
  .mission{grid-template-columns:minmax(0,1fr)}
  .intro{grid-template-columns:minmax(0,1fr)}
  .intro-art{max-width:320px;order:-1}
}
@media (max-width:560px){
  body{font-size:17px}
  .intro{padding-block:24px}
  .intro-text{align-items:stretch;text-align:center}
  .intro .lead{margin:0 auto}
  .three{grid-template-columns:minmax(0,1fr)}
  .case,.quest{padding:16px;border-radius:22px}
  .q-title{font-size:1.4rem}
  .opt-tag{white-space:normal}
}
@media (prefers-reduced-motion: no-preference){
  .opt,.btn,.mdot,.clue{transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease}
  .screen-in{animation:rise .3s ease both}
  @keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar" id="topbar" hidden>
    <svg class="brand-icon" viewBox="0 0 40 40" aria-hidden="true"><circle cx="17" cy="17" r="11" fill="#FFF4D1" stroke="#1C2551" stroke-width="4"/><path d="M25 25l9 9" stroke="#1C2551" stroke-width="5" stroke-linecap="round"/></svg>
    <nav class="progress" aria-label="Progresso">
      <ol class="mdots" id="mdots"></ol>
      <span class="sr-only" id="ptext"></span>
    </nav>
  </header>

  <main>
    <!-- Tela inicial -->
    <section id="screen-intro" class="intro" aria-labelledby="introTitle">
      <div class="intro-text">
        <h1 id="introTitle">Detetives <span>dos Pedidos</span></h1>
        <p class="lead">Ajude Cody e Pixy a investigar pedidos na internet!</p>
        <button class="btn btn-big" id="startBtn" type="button">
          Começar
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="introArt"></div>
    </section>

    <!-- Missão -->
    <section id="screen-mission" class="mission" hidden>
      <article class="case" id="casePanel" aria-label="Situação da missão"></article>
      <div class="quest" id="questPanel"></div>
    </section>

    <!-- Tela final -->
    <section id="screen-final" class="final" hidden aria-labelledby="finalTitle"></section>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Personagens (vetores simples) ---------- */
  function face(eyeY, mouthY){

      '<circle cx="36" cy="'+(eyeY+7)+'" r="3.6" fill="#E58A6A" opacity=".45"/><circle cx="64" cy="'+(eyeY+7)+'" r="3.6" fill="#E58A6A" opacity=".45"/>'+
      '<path d="M43 '+mouthY+' Q50 '+(mouthY+6)+' 57 '+mouthY+'" fill="none" stroke="#1C2551" stroke-width="2.6" stroke-linecap="round"/>';
  }
  function codyBody(){
    return '<path d="M22 100 C24 79 36 71 50 71 C64 71 76 79 78 100Z" fill="#2FA36B"/>'+
      '<circle cx="28.5" cy="49" r="5" fill="#8D5A3B"/><circle cx="71.5" cy="49" r="5" fill="#8D5A3B"/>'+
      '<circle cx="50" cy="48" r="22" fill="#8D5A3B"/>'+
      '<path d="M28 42 C28 22 72 22 72 42 Z" fill="#1C2551"/>'+

      '<circle cx="50" cy="46" r="25" fill="#6A3FC9"/>'+
      '<path d="M22 100 C24 79 36 71 50 71 C64 71 76 79 78 100Z" fill="#F2B825"/>'+

      '<path d="M29 46 C29 28 71 28 71 46 C63 37 41 36 29 46Z" fill="#6A3FC9"/>'+ face(51,58);
  }
  function avatar(who){
    var bg = who === 'cody' ? '#E3F5EC' : '#FFF4D1';
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="av-'+who+'"><circle cx="50" cy="50" r="50"/></clipPath></defs>'+
      '<g clip-path="url(#av-'+who+')"><circle cx="50" cy="50" r="50" fill="'+bg+'"/>'+(who==='cody'?codyBody():pixyBody())+'</g></svg>';
  }
  function introArt(){
    return '<svg class="intro-art" viewBox="0 0 360 260" role="img" aria-label="Cody e Pixy segurando uma lupa, prontos para investigar.">'+

      '<g transform="rotate(9 290 60)"><rect x="262" y="26" width="58" height="72" rx="10" fill="#FFFFFF" stroke="#D8DBEB" stroke-width="3"/><text x="291" y="76" font-size="36" font-weight="900" fill="#5B3FD0" text-anchor="middle" font-family="inherit">?</text></g>'+
      '<g transform="translate(46 108) scale(1.45)">'+codyBody()+'</g>'+
      '<g transform="translate(170 108) scale(1.45)">'+pixyBody()+'</g>'+
      '<g transform="rotate(-25 176 128)"><circle cx="176" cy="128" r="30" fill="#FFFFFF" fill-opacity=".7" stroke="#1C2551" stroke-width="9"/><path d="M176 158 v42" stroke="#1C2551" stroke-width="12" stroke-linecap="round"/></g>'+
      '</svg>';
  }

  /* ---------- Cenas das situações ---------- */
  var DEVICE_TOP = function(id){
    return '<defs><clipPath id="'+id+'"><rect x="36" y="26" width="328" height="198" rx="12"/></clipPath></defs>'+
      '<rect x="20" y="10" width="360" height="230" rx="24" fill="#1C2551"/>'+
      '<circle cx="200" cy="232" r="3.5" fill="#3A4580"/>';
  };
  var SCENES = {
    desenho:
      '<svg class="scene" viewBox="0 0 400 250" role="img" aria-label="Tela do site da atividade, indicado pela professora: um desenho de casa, árvore e sol, um campo para escolher um apelido e um botão Salvar.">'+
      DEVICE_TOP('sc1')+'<g clip-path="url(#sc1)">'+
      '<rect x="36" y="26" width="328" height="198" fill="#FFFFFF"/>'+
      '<rect x="36" y="26" width="328" height="30" fill="#ECE8FD"/>'+
      '<circle cx="54" cy="41" r="5" fill="#5B3FD0"/>'+
      '<text x="66" y="46" font-size="13" font-weight="800" fill="#1C2551">Galeria de desenhos da turma</text>'+
      '<rect x="52" y="68" width="136" height="106" rx="8" fill="#FFF4D1" stroke="#E8D9A8" stroke-width="2"/>'+
      '<circle cx="164" cy="90" r="11" fill="#FFC83D"/>'+
      '<polygon points="74,122 102,98 130,122" fill="#5B3FD0"/>'+
      '<rect x="80" y="121" width="44" height="38" fill="#E58A6A"/>'+
      '<rect x="96" y="137" width="12" height="22" fill="#1C2551"/>'+
      '<rect x="157" y="128" width="6" height="31" fill="#8D5A3B"/>'+
      '<circle cx="160" cy="124" r="14" fill="#2FA36B"/>'+
      '<rect x="54" y="158" width="132" height="14" fill="#9FD9A8"/>'+
      '<text x="204" y="84" font-size="14" font-weight="800" fill="#1C2551">Escolha um apelido</text>'+
      '<text x="204" y="102" font-size="13" fill="#4A5280">para salvar seu desenho:</text>'+
      '<rect x="204" y="114" width="146" height="32" rx="8" fill="#FFFFFF" stroke="#5B3FD0" stroke-width="2.5"/>'+
      '<text x="214" y="135" font-size="13" fill="#7A80A6">apelido inventado</text>'+
      '<rect x="204" y="154" width="96" height="30" rx="15" fill="#157A52"/>'+
      '<text x="252" y="174" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Salvar</text>'+
      '<rect x="52" y="190" width="298" height="24" rx="12" fill="#E3F5EC"/>'+
      '<text x="201" y="206" font-size="12" font-weight="700" fill="#157A52" text-anchor="middle">Site indicado pela professora para a atividade</text>'+
      '</g></svg>',

    premio:
      '<svg class="scene" viewBox="0 0 400 250" role="img" aria-label="Tela de um jogo com uma mensagem por cima: Ganhe moedas grátis! Digite o telefone de alguém da sua família para receber o prêmio.">'+
      DEVICE_TOP('sc2')+'<g clip-path="url(#sc2)">'+
      '<rect x="36" y="26" width="328" height="198" fill="#CFE6FF"/>'+
      '<ellipse cx="70" cy="52" rx="24" ry="9" fill="#FFFFFF"/><ellipse cx="330" cy="70" rx="22" ry="8" fill="#FFFFFF"/>'+
      '<rect x="36" y="196" width="328" height="30" fill="#2FA36B"/>'+
      '<rect x="44" y="160" width="40" height="10" rx="4" fill="#157A52"/><rect x="320" y="150" width="36" height="10" rx="4" fill="#157A52"/>'+
      '<circle cx="60" cy="146" r="6" fill="#FFC83D"/><circle cx="338" cy="134" r="6" fill="#FFC83D"/>'+
      '<rect x="86" y="50" width="232" height="150" rx="16" fill="#1C2551" opacity=".18"/>'+
      '<rect x="80" y="44" width="232" height="150" rx="16" fill="#FFFFFF" stroke="#FFC83D" stroke-width="4"/>'+
      '<circle cx="106" cy="76" r="12" fill="#FFC83D" stroke="#C99400" stroke-width="2.5"/><circle cx="106" cy="76" r="5" fill="none" stroke="#C99400" stroke-width="2.5"/>'+
      '<circle cx="286" cy="76" r="12" fill="#FFC83D" stroke="#C99400" stroke-width="2.5"/><circle cx="286" cy="76" r="5" fill="none" stroke="#C99400" stroke-width="2.5"/>'+

        '<li><span class="n" aria-hidden="true">3</span>O que pode acontecer?</li>'+
      '</ol></section>'+
      '<p class="guide"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#FFC83D"/><rect x="17.5" y="9" width="5" height="15" rx="2.5" fill="#1C2551"/><circle cx="20" cy="30" r="3" fill="#1C2551"/></svg>Na dúvida, peça ajuda!</p>'+
      '<button type="button" class="btn btn-big" id="restartBtn">'+
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Jogar novamente</button>';
    show('final');
    $('finalTitle').focus({preventScroll:true});
  }

  /* ---------- Eventos ---------- */
  $('introArt').innerHTML = introArt();
  $('startBtn').addEventListener('click', function(){ startMission(0); });

  questPanel.addEventListener('click', function(e){
    var opt = e.target.closest('.opt');
    if (opt){ choose(opt); return; }
    if (e.target.closest('#nextBtn')){
      if (st.s < 3){ st.s++; renderStep(true); } else { renderConclusion(); }
      return;
    }
    if (e.target.closest('#nextMissionBtn')){
      if (st.m < 3) startMission(st.m + 1); else renderFinal();
    }
  });

  screens.final.addEventListener('click', function(e){
    if (e.target.closest('#restartBtn')){
      st.done = [false,false,false,false];
      startMission(0);
    }
  });
})();
</script>

</body>
</html>
